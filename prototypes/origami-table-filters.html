<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TableFilters recreation</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
    <style>
      *,::before,::after{box-sizing:border-box}body{margin:0;padding:14px;color:#121212;font-family:Inter,sans-serif}.sds-table-filters{position:relative;width:max-content}.sds-table-filters__trigger{display:flex;height:32px;align-items:center;gap:8px;padding:4px 16px;border:1px solid #792fad;border-radius:6px;background:#fff;color:#792fad;font-size:14px}.sds-table-filters__trigger[aria-expanded="true"]{background:#792fad;color:#fff}.sds-table-filters__trigger:focus-visible,.sds-table-filters__calendar-trigger:focus-visible,.sds-table-filters__segment:focus-visible,.sds-table-filters__calendar-cell:focus-visible{outline:2px solid #792fad;outline-offset:2px}.sds-table-filters__popover{position:absolute;z-index:3;top:40px;left:0;width:min(calc(100vw - 32px),640px);padding:16px;border:1px solid #d4d4d4;border-radius:8px;background:#fff;box-shadow:0 2px 4px rgba(11,31,77,.1)}.sds-table-filters__popover[hidden]{display:none}.sds-table-filters__panel{display:flex;width:100%;flex-direction:column;gap:16px;outline:0}.sds-table-filters__title{margin:0;font-size:14px;font-weight:600}.sds-table-filters__checks{display:grid;grid-template-columns:repeat(3,max-content);justify-content:space-between;row-gap:24px}.sds-table-filters__check{display:flex;align-items:center;gap:8px;font-size:14px}.sds-table-filters__check input{accent-color:#792fad}.sds-table-filters__field{display:flex;min-width:0;flex-direction:column;gap:4px}.sds-table-filters__field-label{font-size:14px;font-weight:600}.sds-table-filters__search{height:40px;padding:9px;border:1px solid #d4d4d4;border-radius:8px;outline:0;font-size:14px}.sds-table-filters__search:focus-visible,.sds-table-filters__date-group:focus-within{border-color:#474747}.sds-table-filters__date-group{display:flex;min-width:0;height:40px;align-items:center;gap:3px;padding:0 4px;border:1px solid #d4d4d4;border-radius:8px;overflow-x:auto}.sds-table-filters__date-time{display:flex;align-items:center;padding:9px 3px;white-space:nowrap}.sds-table-filters__segment{min-width:17px;padding:0 1px;border-radius:4px;outline:0;color:#b9b9b9;font:italic 12px/140% Inter,sans-serif;letter-spacing:1px;text-align:center}.sds-table-filters__segment.sds-table-filters__segment--year{min-width:38px}.sds-table-filters__segment.sds-table-filters__segment--period{min-width:24px;margin-left:3px}.sds-table-filters__segment:focus{background:#d4d4d4;color:#121212;font-size:14px;font-style:normal}.sds-table-filters__segment--literal,.sds-table-filters__range-dash{color:#474747;font-size:14px}.sds-table-filters__calendar-trigger{display:grid;width:32px;height:32px;margin-left:auto;flex:0 0 32px;place-items:center;border:0;border-radius:6px;background:transparent;color:#792fad;font-size:18px}.sds-table-filters__calendar-trigger:hover{background:#f1f1f1}.sds-table-filters__footer{display:flex;align-items:center;justify-content:space-between;padding-top:4px}.sds-table-filters__clear{border:0;background:transparent;color:#792fad}.sds-table-filters__apply{height:40px;padding:8px 20px;border:1px solid #792fad;border-radius:8px;background:#792fad;color:#fff}.sds-table-filters__calendar{position:absolute;z-index:4;top:100%;right:0;width:328px;margin-top:4px;padding:12px;border:1px solid #d4d4d4;border-radius:8px;background:#fff;box-shadow:0 2px 4px rgba(11,31,77,.1)}.sds-table-filters__calendar[hidden]{display:none}.sds-table-filters__calendar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.sds-table-filters__month-button{display:grid;width:28px;height:28px;place-items:center;border:0;border-radius:4px;background:transparent;font-size:18px}.sds-table-filters__month-button:hover{background:#f1f1f1}.sds-table-filters__month-title{margin:0;font-size:16px;font-weight:500}.sds-table-filters__weekdays,.sds-table-filters__calendar-grid{display:grid;grid-template-columns:repeat(7,36px);gap:4px}.sds-table-filters__weekday{height:24px;color:#6b6b6b;font-size:11px;font-weight:600;text-align:center}.sds-table-filters__calendar-grid{grid-template-rows:repeat(6,36px)}.sds-table-filters__calendar-cell{display:grid;width:36px;height:36px;place-items:center;border:0;border-radius:0;background:transparent;color:#121212;font-size:13px}.sds-table-filters__calendar-cell:hover:not(:disabled){background:#f1f1f1}.sds-table-filters__calendar-cell:disabled{color:#b9b9b9}.sds-table-filters__calendar-cell.sds-table-filters__calendar-cell--in-range{background:#f1e7f6;color:#792fad}.sds-table-filters__calendar-cell.sds-table-filters__calendar-cell--range-start,.sds-table-filters__calendar-cell.sds-table-filters__calendar-cell--range-end{border-radius:50%;background:#792fad;color:#fff}.sds-table-filters__calendar-cell.sds-table-filters__calendar-cell--today:not(.sds-table-filters__calendar-cell--range-start):not(.sds-table-filters__calendar-cell--range-end){border-radius:50%;box-shadow:inset 0 0 0 1px #792fad}.sds-table-filters__dismiss{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0 0 0 0)}
    </style>
  </head>
  <body>
    <div class="sds-table-filters">
      <button class="sds-table-filters__trigger" type="button" aria-label="Table filters" aria-haspopup="dialog" aria-expanded="false"><span aria-hidden="true">☷</span><span aria-hidden="true">Filters</span></button>
      <div class="sds-table-filters__popover" aria-label="Table filters" hidden>
        <button class="sds-table-filters__dismiss sds-table-filters__popover-dismiss" type="button">Descartar</button>
        <div class="sds-table-filters__panel" role="dialog" aria-label="Filters" tabindex="-1">
        <h2 class="sds-table-filters__title">Filters</h2>
        <div class="sds-table-filters__checks" role="group" aria-label="Filters"></div>
        <div class="sds-table-filters__field"><label class="sds-table-filters__field-label" for="filter-search">Search</label><input class="sds-table-filters__search" id="filter-search" type="text" placeholder="Search for content" /></div>
        <div class="sds-table-filters__field sds-table-filters__range-field"><span class="sds-table-filters__field-label" id="date-range-label">Date range</span><div class="sds-table-filters__date-group" role="group" aria-labelledby="date-range-label"><div class="sds-table-filters__date-time" role="group" aria-label="Data inicial, Date range" data-slot="start"></div><span class="sds-table-filters__range-dash" aria-hidden="true">–</span><div class="sds-table-filters__date-time" role="group" aria-label="Data final, Date range" data-slot="end"></div><button class="sds-table-filters__calendar-trigger" type="button" aria-label="Calendário, Date range" aria-haspopup="dialog" aria-expanded="false">▣</button></div>
          <div class="sds-table-filters__calendar" role="dialog" aria-label="Calendário, Date range" hidden><button class="sds-table-filters__dismiss sds-table-filters__calendar-dismiss" type="button">Descartar</button><div class="sds-table-filters__calendar-head"><button class="sds-table-filters__month-button sds-table-filters__previous" type="button" aria-label="Mês anterior">‹</button><h3 class="sds-table-filters__month-title" aria-live="polite"></h3><button class="sds-table-filters__month-button sds-table-filters__next" type="button" aria-label="Próximo mês">›</button></div><div class="sds-table-filters__weekdays" aria-hidden="true"></div><div class="sds-table-filters__calendar-grid" role="grid" aria-label="Calendário, Date range"></div><button class="sds-table-filters__dismiss sds-table-filters__calendar-dismiss" type="button">Descartar</button></div>
        </div>
        <div class="sds-table-filters__footer"><button class="sds-table-filters__clear" type="button">Clear filters</button><button class="sds-table-filters__apply" type="button">Apply</button></div>
        </div>
        <button class="sds-table-filters__dismiss sds-table-filters__popover-dismiss" type="button">Descartar</button>
      </div>
    </div>
    <script>
      const levels=['Debug','Error','Fatal','Info','Trace','Warning'];const wrap=document.querySelector('.sds-table-filters'),trigger=document.querySelector('.sds-table-filters__trigger'),popover=document.querySelector('.sds-table-filters__popover'),panel=document.querySelector('.sds-table-filters__panel'),checks=document.querySelector('.sds-table-filters__checks'),search=document.querySelector('.sds-table-filters__search'),calendarTrigger=document.querySelector('.sds-table-filters__calendar-trigger'),calendar=document.querySelector('.sds-table-filters__calendar'),grid=document.querySelector('.sds-table-filters__calendar-grid'),monthTitle=document.querySelector('.sds-table-filters__month-title');const today=new Date();today.setHours(0,0,0,0);let visibleMonth=new Date(today.getFullYear(),today.getMonth(),1),rangeStart=null,rangeEnd=null,focusedDate=new Date(today),applied={levels:[],search:'',start:null,end:null};
      levels.forEach(level=>{const label=document.createElement('label');label.className='sds-table-filters__check';const input=document.createElement('input');input.type='checkbox';input.value=level.toLowerCase();label.append(input,level);checks.append(label)});
      ['dom.','seg.','ter.','qua.','qui.','sex.','sáb.'].forEach(name=>{const day=document.createElement('span');day.className='sds-table-filters__weekday';day.textContent=name;document.querySelector('.sds-table-filters__weekdays').append(day)});
      const dateParts=[['day','dia','dd',1,31,2],['month','mês','mm',1,12,2],['year','ano','aaaa',1,9999,4],['hour','hora',null,1,12,2],['minute','minuto',null,0,59,2],['second','segundo',null,0,59,2],['period','AM/PM','AM',0,1,2]];
      function buildDateTime(slot){const context=slot.dataset.slot==='start'?'Data inicial':'Data final';dateParts.forEach(([part,label,placeholder,min,max,width],index)=>{if(index===3){const comma=document.createElement('span');comma.className='sds-table-filters__segment--literal';comma.textContent=', ';slot.append(comma)}else if(index===1||index===2){const slash=document.createElement('span');slash.className='sds-table-filters__segment--literal';slash.textContent='/';slot.append(slash)}else if(index===4||index===5){const colon=document.createElement('span');colon.className='sds-table-filters__segment--literal';colon.textContent=':';slot.append(colon)}const segment=document.createElement('span');segment.className=`sds-table-filters__segment${part==='year'?' sds-table-filters__segment--year':''}${part==='period'?' sds-table-filters__segment--period':''}`;segment.role='spinbutton';segment.tabIndex=0;segment.dataset.part=part;segment.dataset.width=width;segment.dataset.placeholder=placeholder??'––';segment.textContent=placeholder??'––';segment.setAttribute('aria-label',`${label}, ${context}, Date range`);segment.setAttribute('aria-valuemin',min);segment.setAttribute('aria-valuemax',max);segment.addEventListener('keydown',event=>editSegment(event,segment,slot));slot.append(segment)})}
      document.querySelectorAll('.sds-table-filters__date-time').forEach(buildDateTime);
      function editSegment(event,segment,slot){const all=[...slot.querySelectorAll('.sds-table-filters__segment')],index=all.indexOf(segment),part=segment.dataset.part,min=Number(segment.getAttribute('aria-valuemin')),max=Number(segment.getAttribute('aria-valuemax'));if(event.key==='ArrowLeft'||event.key==='ArrowRight'){all[(index+(event.key==='ArrowRight'?1:-1)+all.length)%all.length].focus();event.preventDefault();return}if(part==='period'&&(event.key==='ArrowUp'||event.key==='ArrowDown')){const next=segment.textContent==='AM'?'PM':'AM';segment.textContent=next;segment.dataset.value=next;event.preventDefault();return}if(event.key==='ArrowUp'||event.key==='ArrowDown'){const seed={day:today.getDate(),month:today.getMonth()+1,year:today.getFullYear(),hour:12,minute:0,second:0}[part];let value=segment.dataset.value?Number(segment.dataset.value)+(event.key==='ArrowUp'?1:-1):seed;if(value>max)value=min;if(value<min)value=max;setSegment(segment,value);event.preventDefault()}else if(/^\d$/.test(event.key)&&part!=='period'){const buffer=((segment.dataset.buffer||'')+event.key).slice(-Number(segment.dataset.width));setSegment(segment,Math.max(min,Math.min(max,Number(buffer))));segment.dataset.buffer=buffer;clearTimeout(segment._timer);segment._timer=setTimeout(()=>delete segment.dataset.buffer,900);if(buffer.length===Number(segment.dataset.width))all[Math.min(index+1,all.length-1)].focus();event.preventDefault()}}
      function setSegment(segment,value){segment.dataset.value=value;segment.textContent=String(value).padStart(Number(segment.dataset.width),'0');segment.setAttribute('aria-valuenow',value)}
      function setDate(slot,date){const values={day:date.getDate(),month:date.getMonth()+1,year:date.getFullYear()};Object.entries(values).forEach(([part,value])=>setSegment(slot.querySelector(`[data-part="${part}"]`),value))}
      function resetDateTimes(){document.querySelectorAll('.sds-table-filters__date-time .sds-table-filters__segment').forEach(segment=>{delete segment.dataset.value;segment.removeAttribute('aria-valuenow');segment.textContent=segment.dataset.placeholder});rangeStart=null;rangeEnd=null;renderCalendar()}
      function same(a,b){return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate()}
      function iso(date){return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`}
      function renderCalendar(){monthTitle.textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(visibleMonth);grid.replaceChildren();const first=new Date(visibleMonth);first.setDate(1-first.getDay());for(let index=0;index<42;index++){const date=new Date(first);date.setDate(first.getDate()+index);const cell=document.createElement('button');cell.type='button';cell.className='sds-table-filters__calendar-cell';cell.role='gridcell';cell.textContent=date.getDate();cell.dataset.date=iso(date);cell.setAttribute('aria-label',new Intl.DateTimeFormat('pt-BR',{dateStyle:'full'}).format(date));cell.tabIndex=same(date,focusedDate)?0:-1;if(date.getMonth()!==visibleMonth.getMonth()){cell.disabled=true;cell.setAttribute('aria-disabled','true')}if(same(date,today)){cell.classList.add('sds-table-filters__calendar-cell--today');cell.setAttribute('aria-current','date')}if(rangeStart&&rangeEnd&&date>rangeStart&&date<rangeEnd)cell.classList.add('sds-table-filters__calendar-cell--in-range');if(same(date,rangeStart)){cell.classList.add('sds-table-filters__calendar-cell--range-start');cell.setAttribute('aria-selected','true')}if(same(date,rangeEnd)){cell.classList.add('sds-table-filters__calendar-cell--range-end');cell.setAttribute('aria-selected','true')}cell.addEventListener('click',()=>pick(date));cell.addEventListener('keydown',moveCalendar);grid.append(cell)}}
      function pick(date){if(!rangeStart||rangeEnd){rangeStart=new Date(date);rangeEnd=null;setDate(document.querySelector('[data-slot="start"]'),date);const end=document.querySelector('[data-slot="end"]');end.querySelectorAll('[data-part="day"],[data-part="month"],[data-part="year"]').forEach(segment=>{delete segment.dataset.value;segment.removeAttribute('aria-valuenow');segment.textContent=segment.dataset.placeholder})}else if(date<rangeStart){rangeEnd=new Date(rangeStart);rangeStart=new Date(date);setDate(document.querySelector('[data-slot="start"]'),rangeStart);setDate(document.querySelector('[data-slot="end"]'),rangeEnd)}else{rangeEnd=new Date(date);setDate(document.querySelector('[data-slot="end"]'),date)}focusedDate=new Date(date);renderCalendar();grid.querySelector(`[data-date="${iso(date)}"]`)?.focus()}
      function moveCalendar(event){const delta={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7}[event.key];if(!delta)return;const next=new Date(event.currentTarget.dataset.date+'T00:00:00');next.setDate(next.getDate()+delta);if(next.getMonth()!==visibleMonth.getMonth())visibleMonth=new Date(next.getFullYear(),next.getMonth(),1);focusedDate=next;renderCalendar();grid.querySelector(`[data-date="${iso(next)}"]`)?.focus();event.preventDefault()}
      function setCalendar(open){calendar.hidden=!open;calendarTrigger.setAttribute('aria-expanded',String(open));if(open){focusedDate=rangeStart?new Date(rangeStart):new Date(today);visibleMonth=new Date(focusedDate.getFullYear(),focusedDate.getMonth(),1);renderCalendar();requestAnimationFrame(()=>grid.querySelector(`[data-date="${iso(focusedDate)}"]`)?.focus())}else calendarTrigger.focus()}
      function restoreApplied(){checks.querySelectorAll('input').forEach(input=>input.checked=applied.levels.includes(input.value));search.value=applied.search;resetDateTimes();if(applied.start){rangeStart=new Date(applied.start);setDate(document.querySelector('[data-slot="start"]'),rangeStart)}if(applied.end){rangeEnd=new Date(applied.end);setDate(document.querySelector('[data-slot="end"]'),rangeEnd)}renderCalendar()}
      function setPanel(open,{restore=true}={}){popover.hidden=!open;trigger.setAttribute('aria-expanded',String(open));if(open){if(restore)restoreApplied();requestAnimationFrame(()=>panel.focus())}else{calendar.hidden=true;calendarTrigger.setAttribute('aria-expanded','false');trigger.focus()}}
      trigger.addEventListener('click',()=>setPanel(popover.hidden));calendarTrigger.addEventListener('click',()=>setCalendar(calendar.hidden));document.querySelector('.sds-table-filters__previous').addEventListener('click',()=>{visibleMonth.setMonth(visibleMonth.getMonth()-1);renderCalendar()});document.querySelector('.sds-table-filters__next').addEventListener('click',()=>{visibleMonth.setMonth(visibleMonth.getMonth()+1);renderCalendar()});document.querySelectorAll('.sds-table-filters__calendar-dismiss').forEach(button=>button.addEventListener('click',()=>setCalendar(false)));document.querySelectorAll('.sds-table-filters__popover-dismiss').forEach(button=>button.addEventListener('click',()=>setPanel(false,{restore:false})));
      document.querySelector('.sds-table-filters__clear').addEventListener('click',()=>{checks.querySelectorAll('input').forEach(input=>input.checked=false);search.value='';resetDateTimes();applied={levels:[],search:'',start:null,end:null}});document.querySelector('.sds-table-filters__apply').addEventListener('click',()=>{applied={levels:[...checks.querySelectorAll('input:checked')].map(input=>input.value),search:search.value,start:rangeStart?rangeStart.toISOString():null,end:rangeEnd?rangeEnd.toISOString():null};setPanel(false,{restore:false})});document.addEventListener('mousedown',event=>{if(!popover.hidden&&!wrap.contains(event.target))setPanel(false,{restore:false})});document.addEventListener('keydown',event=>{if(popover.hidden)return;if(event.key==='Escape'){if(!calendar.hidden)setCalendar(false);else setPanel(false,{restore:false});event.preventDefault();return}if(event.key==='Tab'){const focusables=[...popover.querySelectorAll('button:not([disabled]),input:not([disabled]),[tabindex="0"]')].filter(item=>!item.closest('[hidden]'));const first=focusables[0],last=focusables.at(-1);if(event.shiftKey&&(document.activeElement===first||document.activeElement===panel)){last.focus();event.preventDefault()}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault()}}});renderCalendar();if(location.search.includes('open'))setPanel(true);
    </script>
  <script>if(new URLSearchParams(location.search).get('preview')==='1'){document.body.inert=true;document.documentElement.style.scrollbarWidth='none';}</script></body>
</html>
